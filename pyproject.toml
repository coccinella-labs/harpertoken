[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpertoken-convai-finetune"
version = "0.1.0"
description = "Fine-tuning script for Harpertoken ConvAI model on SQuAD"
authors = [
    {name = "Coccinella Labs", email = "maintainers@coccinella-labs.com"},
]
dependencies = [
    "transformers>=4.57,<6",
    "torch",
    "datasets",
    "accelerate",
    "pydantic",
]
# CI tests 3.10 and 3.11, and every module imports cleanly on both; 3.14 was
# only ever asserted here, which made `pip install .` fail on the versions the
# project actually supports.
requires-python = ">=3.10"

[tool.setuptools]
# Without an explicit package list, setuptools produced an empty wheel: the
# repository root has no top-level package or module matching the project name,
# so nothing was collected and `pip install .` yielded no importable code.
packages = ["scripts"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "datasets.*",
    "torch.*",
]
ignore_missing_imports = true
