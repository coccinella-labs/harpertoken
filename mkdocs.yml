---
site_name: Harpertoken ConvAI Fine-tuning
site_description: Scripts to fine-tune the harpertokenConvAI model on SQuAD dataset
site_author: Coccinella Labs
site_url: https://coccinella-labs.github.io/harpertoken

repo_url: https://github.com/coccinella-labs/harpertoken
repo_name: harpertoken

nav:
- Home: index.md
- Installation: installation.md
- Usage: usage.md
- API: api.md
- Contributing: contributing.md

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
  - navigation.tabs
  - navigation.sections
  - toc.integrate
  - search.suggest
  - search.highlight

plugins:
- search
- mkdocstrings

markdown_extensions:
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.arithmatex:
    generic: true
- footnotes
- admonition
- toc:
    permalink: true
