---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
   lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - run: pre-commit run --all-files

   ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov huggingface_hub
      - run: python -m py_compile scripts/*.py
      - run: |
          PYTHONPATH=. pytest tests/ -v --maxfail=1 --disable-warnings \
            --cov=scripts --cov-report=term-missing
      - run: |
          python -c "from scripts.data_prep import load_and_preprocess_data; print('Import ok')"
          python -c "import scripts.train; print('Train import ok')"
          python -c "import scripts.evaluate; print('Evaluate import ok')"
      # Exercise the push_to_hub path on one leg only. Two matrix legs writing
      # harpertoken/clue concurrently raced each other, and a plain push should
      # never replace a published model, so this writes to a scratch branch that
      # the step below removes.
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FT_EPOCHS: 1
          FT_BATCH_SIZE: 1
          FT_LR: 2e-5
          FT_UPLOAD: ${{ matrix.python-version == '3.11' }}
          FT_REPO_ID: harpertoken/clue
          FT_REVISION: ci-smoke
          PYTHONPATH: .
        run: python scripts/train.py

      - name: Remove the smoke-test branch
        if: always() && matrix.python-version == '3.11'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -s -o /dev/null -w "branch delete HTTP %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/models/harpertoken/clue/branch/ci-smoke
      # evaluate.py imports scripts.api for the span decoder, so the repo root
      # has to be importable here as it is for the training step.
      - run: PYTHONPATH=. python scripts/evaluate.py
      - run: echo "✅ Tests, imports, and training passed on Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY

   sync-card:
    # model_card.md is the single writer for harpertoken/clue's card. This job
    # re-uploads it on every push to main, so a direct Hub edit is overwritten
    # within minutes instead of lingering until the next version-gated publish.
    # Card-only, no training, no weights touched.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_file(
              path_or_fileobj=open('model_card.md', 'rb').read(),
              path_in_repo='README.md',
              repo_id='harpertoken/clue',
              repo_type='model',
          )
          print('Card synced to harpertoken/clue')
          "

   release-build:
    runs-on: ubuntu-latest
    needs: [lint, ci-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are required so the "version already released" check below
          # can see them. Without this, checkout is shallow and tag-less,
          # the check always reports exists=false, and every push to main
          # tries to rebuild and republish an already released version.
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          echo "version=$(grep -oP '(?<=^version = \")[^\"]+' pyproject.toml | head -1)" >> $GITHUB_OUTPUT

      - name: Check if version tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Report if version already released
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Version already released. Skipping Docker build and release."

      - name: Create Git tag
        # Before Docker, not after: if the Docker steps fail on missing secrets,
        # the tag still exists, so the gate closes and later pushes do not retry
        # the whole release, re-running publish-model and overwriting clue each
        # time. A tag without an image is honest; a loop that clobbers the Hub
        # model on every push is not. A failed Docker step also skips the release
        # note below by default, so no false claim is published.
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harpertoken-convai-finetune:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/harpertoken-convai-finetune:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/harpertoken-convai-finetune:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }}"
          body: |
            🚀 Automatic release for version **${{ steps.version.outputs.version }}**
            - Docker image pushed to DockerHub & GHCR
            - Model uploaded to Hugging Face Hub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

   publish-model:
    # Publishing is a release decision, not a side effect of every push. The
    # gate mirrors release-build: this push releases the version when no v tag
    # exists for it yet. Note release-build creates that tag with GITHUB_TOKEN,
    # which does not trigger workflow runs, so gating on a tag push would never
    # fire.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, ci-test]
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the tag lookup below sees existing tags.
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          echo "version=$(grep -oP '(?<=^version = \")[^\"]+' pyproject.toml | head -1)" >> $GITHUB_OUTPUT

      - name: Check if version tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Report if version already released
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Version already released. Skipping model publish."

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('**/requirements.txt') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt huggingface_hub
      - name: Train and publish model
        if: steps.check_tag.outputs.exists != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FT_EPOCHS: 1
          FT_BATCH_SIZE: 1
          FT_LR: 2e-5
          FT_UPLOAD: 'true'
          FT_REPO_ID: harpertoken/clue
          PYTHONPATH: .
        run: |
          python scripts/train.py
          python scripts/evaluate.py
