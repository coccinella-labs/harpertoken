---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
   lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - run: pre-commit run --all-files

   ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov huggingface_hub
      - run: python -m py_compile scripts/*.py
      - run: |
          PYTHONPATH=. pytest tests/ -v --maxfail=1 --disable-warnings \
            --cov=scripts --cov-report=term-missing
      - run: |
          python -c "from scripts.data_prep import load_and_preprocess_data; print('Import ok')"
          python -c "import scripts.train; print('Train import ok')"
          python -c "import scripts.evaluate; print('Evaluate import ok')"
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FT_EPOCHS: 1
          FT_BATCH_SIZE: 1
          FT_LR: 2e-5
          FT_UPLOAD: true
          PYTHONPATH: .
        run: python scripts/train.py
      - run: python scripts/evaluate.py
      - run: echo "✅ Tests, imports, and training passed on Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY

   release-build:
    runs-on: ubuntu-latest
    needs: [lint, ci-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are required so the "version already released" check below
          # can see them. Without this, checkout is shallow and tag-less,
          # the check always reports exists=false, and every push to main
          # tries to rebuild and republish an already released version.
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          echo "version=$(grep -oP '(?<=__version__ = \")[^\"]+' __version__.py)" >> $GITHUB_OUTPUT

      - name: Check if version tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Report if version already released
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Version already released. Skipping Docker build and release."

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image
        if: steps.check_tag.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harpertoken-convai-finetune:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/harpertoken-convai-finetune:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/harpertoken-convai-finetune:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Release v${{ steps.version.outputs.version }}"
          body: |
            🚀 Automatic release for version **${{ steps.version.outputs.version }}**
            - Docker image pushed to DockerHub & GHCR
            - Model uploaded to Hugging Face Hub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
